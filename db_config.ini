[database]
# 【連線主機設定】
# 1. 本機執行: 127.0.0.1
# 2. Synology NAS (內網): 填入 NAS IP (例如 192.168.1.100)
# 3. Internet (外網): 填入 DDNS (例如 yourname.synology.me) 或公網固定 IP
host = 127.0.0.1

# 【通訊埠】
# 本機/標準 MariaDB 通常為 3306；Synology 套件中心 MariaDB 10 常預設為 3307
port = 3306

user = stock_user
password = 12345678
database = taiwanstock
charset = utf8mb4